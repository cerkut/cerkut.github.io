- title: "Enhancing Sound, Music, and Movement Computing with Differentiable DSP"
  venue: "Sound and Music Computing Conference (SMC'22), Saint-Étienne, France"
  location: "Online"
  date: 2022-06-09
  description: >-
    Impact of Differentiable Digital Signal Processing (DDSP) on the recent work at the Multisensory Experience Lab. We can deploy
    DDSP-based real-time plugins fast because we started the work about 25 years ago, and we are implementing the principles of MLOps.
    The talk compares this approach with what was used two decades ago with shallow-learning models, self-recorded or synthetic data,
    and self-written code and frameworks.
  url: "https://youtu.be/Kr_807NNYVU?t=513"
  url_label: "Watch the talk"

- title: "Multisensory Processing at MEL"
  venue: "Danish Sound Cluster, Struer, Denmark"
  location: "Online"
  date: 2021-12-07
  description: >-
    Recent work at the Multisensory Experience Lab on physics-based audio and movement models beyond deep learning, and what is to
    come: graphical and physics-based deep learning. The lab investigates combinations of input and output modalities in interactive
    applications, in areas such as health, rehabilitation, education, art and entertainment. MEL focuses on physics-based deep learning
    and differentiable programming, aiming for interpretable models that optimise well-understood signal processing algorithms with
    structural biases rather than a generic black box.
  url: "https://www.youtube-nocookie.com/embed/ASulDXGS988?start=4038"
  url_label: "Watch the talk"
  extra_link: "https://danishsoundcluster.dk/multisensory-processing"
  extra_link_label: "More info"

