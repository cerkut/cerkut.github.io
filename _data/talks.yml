- title: "Operationalizing Sound and Music with Foundational AI Models"
  venue: "C4DM - Centre for Digital Music, Queen Mary University of London, UK"
  location: "Online"
  date: 2022-12-10
  description: >-
    Impact of MLOps on the recent work at Aalborg University and the Multisensory Experience Lab. I emphasized that there are no
    foundational models for audio yet (but we may expect them soon), and in January 2023 they started to pour in batches!
  url: "https://www.youtube.com/watch?v=U6YQ1wLrIDg"
