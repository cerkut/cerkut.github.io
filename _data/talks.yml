- title: "AI: Embrace, Adapt, Resist?"
  type: "Panel discussion, 45 minutes"
  venue: "Danish Sound Day 2026, Danish Sound Cluster"
  location: "DTU Skylab, Denmark"
  date: 2026-11-11
  upcoming: true
  description: >-
    Panel with Miriam Plon Sauer (Global Chief Strategy Officer, AKQA), Cumhur Erkut (Associate Professor and AI Engineering lecturer,
    Aalborg University) and Lars Tirsbæk (Head of Studies, Sonic College), moderated by Nick Dunkerley (Founder, Hindenburg Systems).
    AI is changing how we develop products, produce sound and teach the next generation. Should we embrace it, adapt to it, or resist it?
  url: "https://danishsoundcluster.dk/danish-sound-day-2026/"
  url_label: "Event page"

- title: "A new era of AI: Dozens of miniature brain models"
  type: "Podcast interview"
  venue: "Baris & Baris (YouTube podcast)"
  location: "Online"
  date: 2025-06-04
  note: "In Turkish"
  description: >-
    Conversation on artificial intelligence and virtual reality, covering my academic path, my time in Finland, the links between brain
    function and AI, deep learning, transformer architectures, the limits of large language models, data quality and synthetic data, and
